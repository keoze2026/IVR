<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>No connection</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
             background: #eef4fc; color: #0f172a; font-family: Roboto, system-ui, sans-serif; text-align: center; }
      main { background: #fff; border: 1px solid #dce6f5; border-radius: 20px; padding: 32px 24px; max-width: 360px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { margin: 0 0 20px; color: #44546c; line-height: 1.5; }
      button { border: 0; border-radius: 12px; background: #155dfc; color: #fff; font: inherit; font-weight: 700; padding: 12px 24px; }
    </style>
  </head>
  <body>
    <main>
      <h1>No connection</h1>
      <p>Check your internet connection and try again. Calls that are already running carry on.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
