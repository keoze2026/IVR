<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Outbound" />
    <title>Outbound IVR — Operator Portal</title>
    <link rel="icon" type="image/svg+xml" href="/assets/pwa/icon.svg" />
    <link rel="apple-touch-icon" href="/assets/pwa/app-180.png" />
    <link rel="manifest" href="/assets/pwa/app.webmanifest.json" />
    <script>
      // System administration installs as its own app. Chosen before the page
      // loads, so a phone reads the right name and icon.
      if (/^\/admin(\/|$)/.test(location.pathname)) {
        document.querySelector('link[rel="manifest"]').href = "/assets/pwa/admin.webmanifest.json";
        document.querySelector('link[rel="apple-touch-icon"]').href = "/assets/pwa/admin-180.png";
        document.querySelector('meta[name="apple-mobile-web-app-title"]').content = "Admin";
        document.title = "Outbound IVR — System administration";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
