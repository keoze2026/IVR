# ---------------------------------------------------------------------------
# Local / staging topology (spec 13.1).
#
# Production runs the same images under systemd or Kubernetes with the same
# role split; the only differences are replica counts, managed Postgres/Redis,
# and pgbouncer in front of the database.
# ---------------------------------------------------------------------------
name: ivr-platform

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  # Order matters: container.env re-points the host-oriented values in ../.env
  # (127.0.0.1 and published ports) at the compose network's service names.
  env_file:
    - ../.env
    - ./container.env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ivr}
      POSTGRES_USER: ${POSTGRES_USER:-ivr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ivr}
    command:
      - postgres
      # The dial path is short transactions at high frequency; the defaults
      # are tuned for a much smaller working set.
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=16MB
      - -c
      - random_page_cost=1.1
      # Log anything slower than a webhook's whole latency budget.
      - -c
      - log_min_duration_statement=200
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ivr}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Host port is configurable so this can coexist with a system Postgres
    # already holding 5432, and defaults to a localhost-only bind so the
    # database is never reachable from outside the machine. The in-container
    # port is always 5432.
    ports:
      - "${POSTGRES_HOST_PORT:-127.0.0.1:5434}:5432"

  redis:
    image: redis:7-alpine
    # appendfsync everysec on the counters DB: losing a second of KPIs is a
    # dashboard blip, losing the channel semaphore is over-dialling.
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Configurable for the same reason as Postgres: a host Redis may already
    # hold 6379. Defaults to a localhost-only bind on a non-clashing port.
    # In-container it is always 6379 (see container.env).
    ports:
      - "${REDIS_HOST_PORT:-127.0.0.1:6380}:6379"

  web:
    <<: *app
    command: ["web"]
    # No host port: the only public entrypoint is nginx, which reaches this
    # over the compose network. Not published, so it cannot clash with a
    # service the host already runs on 8000.
    expose:
      - "8000"

  asgi:
    <<: *app
    command: ["asgi"]
    environment:
      RUN_MIGRATIONS: "0"
    # No host port, same reason as web. nginx reaches it as channels:8000.
    expose:
      - "8000"

  beat:
    <<: *app
    command: ["beat"]
    environment:
      RUN_MIGRATIONS: "0"

  pacer:
    <<: *app
    command: ["pacer"]
    environment:
      RUN_MIGRATIONS: "0"

  dispatch:
    <<: *app
    command: ["dispatch"]
    environment:
      RUN_MIGRATIONS: "0"
    deploy:
      replicas: 2

  events:
    <<: *app
    command: ["events"]
    environment:
      RUN_MIGRATIONS: "0"
    deploy:
      replicas: 2

  telemetry:
    <<: *app
    command: ["telemetry"]
    environment:
      RUN_MIGRATIONS: "0"

  maintenance:
    <<: *app
    command: ["maintenance"]
    environment:
      RUN_MIGRATIONS: "0"

  flower:
    <<: *app
    command: ["flower"]
    environment:
      RUN_MIGRATIONS: "0"
    # Localhost-only: reach it over an SSH tunnel, never the open internet.
    ports:
      - "127.0.0.1:5555:5555"

  # Operator portal: the BFF plus the built SPA in one image. It holds the API
  # key server-side so the browser never sees a credential, and nginx gives it
  # "/" while Django keeps /api, /ws, /webhooks and /admin.
  client:
    build:
      context: ../../client
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "8787"
      # Service name, not localhost: this runs in its own container.
      IVR_API_BASE: http://web:8000
      # Signs the session cookie. Must be set and at least 32 characters, or
      # the BFF refuses to start in production rather than minting sessions
      # that silently differ between replicas.
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      # nginx overwrites X-Forwarded-For with the real client address, so the
      # BFF may preserve that chain. Without this it would report the nginx
      # container's address to Django and APIKey.allowed_cidrs would never
      # match a real operator.
      TRUST_PROXY_XFF: "1"
    depends_on:
      - web
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - asgi
      - client
    # The one public port: the operator portal. Configurable so it can be
    # placed on a port free of the host's other projects. When a domain and
    # TLS land, front this with the host's nginx and bind it to localhost.
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

  # Object storage for uploaded sounds, pre-rendered prompts and recordings.
  # S3-compatible, so the same code path serves real AWS S3 in production —
  # only AWS_S3_ENDPOINT_URL changes. Buckets are created by the entrypoint.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-ivrminio}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY}
    volumes:
      - miniodata:/data
    # Localhost-only: object storage and its console are internal. Uploaded
    # sound is served to the app over the compose network, not the public port.
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  redisdata:
