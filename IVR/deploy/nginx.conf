worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    log_format json escape=json
        '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"rt":$request_time,"ua":"$http_user_agent"}';
    access_log /dev/stdout json;

    upstream django  { server web:8000;  keepalive 32; }
    upstream channels { server asgi:8000; keepalive 32; }
    # The operator portal's BFF. It holds the API key server-side and serves
    # the built SPA, so it owns "/" while Django keeps the machine surfaces.
    upstream portal  { server client:8787; keepalive 32; }

    # Preserve the *client's* protocol rather than this hop's.
    #
    # This server listens on plain HTTP and is expected to sit behind something
    # that terminates TLS. Sending `$scheme` would hardcode "http", which the
    # application reads via SECURE_PROXY_SSL_HEADER; with SECURE_SSL_REDIRECT
    # on in production that yields a 301 to https, back to this listener, and
    # round again — an infinite redirect. It would also overwrite a correct
    # header set by an upstream load balancer.
    #
    # PUBLIC_BASE_URL must match what the client sees for the same reason:
    # webhook signatures are verified against the rebuilt URL.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # Two zones with different shapes. The webhook zone is sized for the
    # carrier's real callback rate (4+ per call at the configured CPS) and is
    # deliberately generous — throttling a carrier callback loses call state.
    # The API zone is sized for humans.
    limit_req_zone $binary_remote_addr zone=api:10m     rate=30r/s;
    limit_req_zone $binary_remote_addr zone=webhooks:20m rate=200r/s;

    server {
        listen 80;
        server_name _;

        client_max_body_size 1m;   # uploads go straight to object storage
        client_body_timeout 10s;
        proxy_read_timeout 30s;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # In production, terminate TLS here and add:
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # --- Carrier callbacks ------------------------------------------
        location /webhooks/ {
            limit_req zone=webhooks burst=400 nodelay;

            # X-Forwarded-For is *set*, not appended: the application trusts
            # the left-most entry for the IP allowlist, and appending would let
            # a caller spoof it by sending their own header.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Host $host;
            proxy_pass http://django;

            # The carrier gives up long before this; failing fast frees the
            # worker for the retry rather than holding both.
            proxy_read_timeout 10s;
        }

        # --- WebSocket --------------------------------------------------
        location /ws/ {
            proxy_pass http://channels;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 3600s;   # dashboards stay open all day
        }

        # --- Operator API -----------------------------------------------
        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Host $host;
            proxy_pass http://django;
        }

        location /static/ {
            alias /app/staticfiles/;
            expires 7d;
            access_log off;
        }

        location = /healthz { proxy_pass http://django; access_log off; }
        location = /readyz  { proxy_pass http://django; access_log off; }


        # --- Operator portal ---------------------------------------------
        # Everything not claimed above is the SPA and its session endpoints.
        #
        # X-Forwarded-For is *set* from $remote_addr rather than appended, for
        # the same reason as the webhook block: the BFF forwards this value to
        # Django, which checks APIKey.allowed_cidrs against the left-most
        # entry. Appending would let a caller prepend an allowed address and
        # defeat the restriction.
        location / {
            limit_req zone=api burst=60 nodelay;
            # Audio pool sounds are uploaded through the portal (browser -> BFF
            # -> Django -> object storage), not by a presigned PUT, so the
            # server-wide 1m cap would reject any real recording. Allow room
            # for a prompt or a short message here.
            client_max_body_size 32m;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Host $host;
            proxy_pass http://portal;
        }
    }
}
